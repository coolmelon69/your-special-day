<!--
  Supabase "Confirm signup" email template.
  Paste into: Supabase Dashboard → Authentication → Email Templates → Confirm signup.
  Variables Supabase injects: {{ .ConfirmationURL }} {{ .Email }} {{ .SiteURL }}
-->
<!doctype html>
<html>
  <body style="margin:0; padding:0; background-color:#f7f4fa; font-family:'Helvetica Neue', Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f4fa; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border:1px solid #e8e2f0; border-radius:12px; overflow:hidden; max-width:480px; width:100%;">

            <!-- eyebrow -->
            <tr>
              <td style="padding:40px 40px 0 40px; text-align:center;">
                <span style="font-family:'Courier New', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#8a7a99;">
                  — Nº 01 · Confirm your email —
                </span>
              </td>
            </tr>

            <!-- heading -->
            <tr>
              <td style="padding:16px 40px 0 40px; text-align:center;">
                <h1 style="margin:0; font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:32px; line-height:1.15; color:#241f2b;">
                  Welcome to<br/><em style="color:#c9578f; font-style:italic;">Your Special Day</em>
                </h1>
              </td>
            </tr>

            <!-- body copy -->
            <tr>
              <td style="padding:20px 40px 0 40px; text-align:center;">
                <p style="margin:0; font-size:15px; line-height:1.6; color:#5a5266;">
                  One tap and you're in. Confirm your email to start your journey.
                </p>
              </td>
            </tr>

            <!-- button -->
            <tr>
              <td style="padding:32px 40px 8px 40px; text-align:center;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block; background-color:#8b4fb5; color:#ffffff; font-family:'Helvetica Neue', Arial, sans-serif; font-size:14px; font-weight:600; letter-spacing:0.5px; text-decoration:none; padding:14px 36px; border-radius:8px;">
                  Confirm email
                </a>
              </td>
            </tr>

            <!-- fallback link -->
            <tr>
              <td style="padding:16px 40px 0 40px; text-align:center;">
                <p style="margin:0; font-family:'Courier New', monospace; font-size:11px; color:#a89bb5; word-break:break-all;">
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>

            <!-- divider -->
            <tr>
              <td style="padding:32px 40px 0 40px;">
                <div style="border-top:1px solid #ece6f2;"></div>
              </td>
            </tr>

            <!-- footer -->
            <tr>
              <td style="padding:20px 40px 40px 40px; text-align:center;">
                <p style="margin:0; font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.5px; color:#a89bb5;">
                  Didn't sign up? Ignore this email.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
